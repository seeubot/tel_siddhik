<!DOCTYPE html>
<html>
<head>
    <title>Orey! Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f4f8fa; }
        h1 { color: #1a2b4c; margin-bottom: 4px; }
        .subtitle { color: #5c6e8d; margin-bottom: 24px; font-size: 14px; }
        
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: #fff; border-radius: 12px; padding: 4px; border: 1px solid #e2eaf2; }
        .tab { flex: 1; padding: 10px; text-align: center; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; border: none; background: transparent; color: #5c6e8d; }
        .tab.active { background: #007aff; color: #fff; }
        
        .panel { display: none; }
        .panel.active { display: block; }
        
        label { display: block; margin-top: 14px; font-weight: 600; color: #5c6e8d; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { width: 100%; padding: 10px 14px; margin-top: 4px; border: 1px solid #e2eaf2; border-radius: 10px; font-size: 14px; font-family: inherit; background: #fff; }
        textarea { resize: vertical; min-height: 120px; }
        button { margin-top: 16px; padding: 12px 24px; background: #007aff; color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; }
        button.secondary { background: #e1efff; color: #007aff; margin-top: 8px; }
        button.danger { background: #ea5455; }
        .msg { padding: 10px 14px; border-radius: 8px; margin-top: 12px; font-size: 13px; }
        .msg.success { background: #e8f5e9; color: #28c76f; }
        .msg.error { background: #ffebee; color: #ea5455; }
        .msg.info { background: #e1efff; color: #007aff; }
        
        .stats { display: flex; gap: 12px; margin-bottom: 20px; }
        .stat { flex: 1; background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e2eaf2; text-align: center; }
        .stat-num { font-size: 28px; font-weight: 800; color: #1a2b4c; }
        .stat-label { font-size: 11px; color: #5c6e8d; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .json-preview { background: #1a2b4c; color: #e2e8f0; padding: 14px; border-radius: 10px; font-size: 12px; font-family: 'Courier New', monospace; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Orey! Admin Panel</h1>
    <p class="subtitle">Manage game questions for Telugu Games</p>
    
    <div class="stats" id="stats"></div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('add')">Add Single</button>
        <button class="tab" onclick="switchTab('bulk')">Bulk Import</button>
        <button class="tab" onclick="switchTab('demo')">Demo Data</button>
    </div>

    <!-- Add Single Panel -->
    <div id="panel-add" class="panel active">
        <label>Game Type</label>
        <select id="gameType">
            <option value="movie">Guess the Movie</option>
            <option value="song">Song Antakshari</option>
            <option value="food">Food Quiz</option>
        </select>

        <label>Question</label>
        <input id="question" placeholder="Enter question" />

        <label>Clue (optional)</label>
        <input id="clue" placeholder="Enter clue" />

        <label>Option 1 *</label>
        <input id="opt1" placeholder="Option 1" />

        <label>Option 2 *</label>
        <input id="opt2" placeholder="Option 2" />

        <label>Option 3</label>
        <input id="opt3" placeholder="Option 3" />

        <label>Option 4</label>
        <input id="opt4" placeholder="Option 4" />

        <label>Correct Answer *</label>
        <input id="correct" placeholder="Must match one option exactly" />

        <button onclick="submitSingle()">Add Question</button>
        <div id="msg-add"></div>
    </div>

    <!-- Bulk Import Panel -->
    <div id="panel-bulk" class="panel">
        <label>Game Type</label>
        <select id="bulkGameType">
            <option value="movie">Guess the Movie</option>
            <option value="song">Song Antakshari</option>
            <option value="food">Food Quiz</option>
        </select>

        <label>Paste JSON Array of Questions</label>
        <textarea id="bulkJson" placeholder='[
  {
    "question": "Which movie?",
    "clue": "Hint text",
    "options": ["Answer1", "Answer2", "Answer3", "Answer4"],
    "correctAnswer": "Answer1"
  }
]'></textarea>

        <button onclick="submitBulk()">Import Questions</button>
        <div id="msg-bulk"></div>
    </div>

    <!-- Demo Data Panel -->
    <div id="panel-demo" class="panel">
        <label>Select Game Type</label>
        <select id="demoGameType">
            <option value="movie">Guess the Movie (8 questions)</option>
            <option value="song">Song Antakshari (6 questions)</option>
            <option value="food">Food Quiz (6 questions)</option>
            <option value="all">All Games (20 questions)</option>
        </select>

        <button onclick="generateDemo()" style="margin-top:12px">Preview Demo Data</button>
        
        <label style="margin-top:16px">Preview</label>
        <div id="demoPreview" class="json-preview">Select a game type and click preview...</div>
        
        <button onclick="importDemo()" class="secondary">Import This Data</button>
        <div id="msg-demo"></div>
    </div>

    <script>
        const API_URL = 'https://parallel-elsi-seeutech-50a3ab2e.koyeb.app';
        const API_KEY = 'maya@1660440';

        const DEMO_DATA = {
            movie: [
                { question: 'Which Tollywood movie?', clue: 'Insect + King', options: ['Ant-Man', 'Eega', 'Robo', 'Akhanda'], correctAnswer: 'Eega' },
                { question: 'Which Tollywood movie?', clue: 'Cycle + Fire', options: ['Arjun Reddy', 'Jersey', 'Race Gurram', 'Geetha Govindam'], correctAnswer: 'Arjun Reddy' },
                { question: 'Which Tollywood movie?', clue: 'Fort + Ghost', options: ['Arundhati', 'Magadheera', 'Chandramukhi', 'Kanchana'], correctAnswer: 'Arundhati' },
                { question: 'Which Tollywood movie?', clue: 'Ocean + Child', options: ['Bahubali', 'Sahoo', 'Kalki', 'Gangotri'], correctAnswer: 'Bahubali' },
                { question: 'Which Tollywood movie?', clue: 'Lion + Fire', options: ['Simhadri', 'Simha', 'Legend', 'Lion'], correctAnswer: 'Simhadri' },
                { question: 'Which Tollywood movie?', clue: 'King + Tiger', options: ['Rangasthalam', 'Pushpa', 'AVPL', 'Janatha Garage'], correctAnswer: 'Rangasthalam' },
                { question: 'Which Tollywood movie?', clue: 'Mirror + Dance', options: ['Fidaa', 'Bommarillu', 'NVN', 'Arya 2'], correctAnswer: 'Fidaa' },
                { question: 'Which Tollywood movie?', clue: 'Police + Spicy', options: ['Temper', 'Pokiri', 'Gabbar Singh', 'Dookudu'], correctAnswer: 'Temper' },
            ],
            song: [
                { question: 'Complete: "Kannulu rendu..."', clue: 'Sita Ramam song', options: ['Kalisi untaayi', 'Maatallo untaayi', 'Swapnam lo untaayi', 'Gunde lo untaayi'], correctAnswer: 'Kalisi untaayi' },
                { question: 'Who sang "Inkem Inkem Kaavaale"?', clue: 'Geetha Govindam', options: ['Sid Sriram', 'Anirudh', 'Shreya Ghoshal', 'SPB'], correctAnswer: 'Sid Sriram' },
                { question: 'Complete: "Nee kallu chusthe..."', clue: 'Nenu Local', options: ['Gunde aagipoyindhe', 'Time aagipoyindhe', 'World aagipoyindhe', 'Love start ayindhe'], correctAnswer: 'Gunde aagipoyindhe' },
                { question: '"Oopiri aaguthumandi..." from?', clue: 'Emotional hit', options: ['Vakeel Saab', 'Jersey', 'Mahanati', 'Majili'], correctAnswer: 'Vakeel Saab' },
                { question: 'Baahubali music composer?', clue: 'Epic music', options: ['MM Keeravani', 'DSP', 'Thaman', 'Anirudh'], correctAnswer: 'MM Keeravani' },
                { question: 'Complete: "Raamuloo..."', clue: 'RRR song', options: ['Rudrulaa', 'Seethalaa', 'Bheemulaa', 'Koushikaa'], correctAnswer: 'Rudrulaa' },
            ],
            food: [
                { question: 'Main ingredient in Gongura Pachadi?', clue: 'Andhra special', options: ['Sorrel leaves', 'Spinach', 'Coriander', 'Mint'], correctAnswer: 'Sorrel leaves' },
                { question: 'City famous for Hyderabadi Biryani?', clue: 'Nizam capital', options: ['Hyderabad', 'Vijayawada', 'Vizag', 'Warangal'], correctAnswer: 'Hyderabad' },
                { question: 'Pesarattu is made from?', clue: 'Green gram', options: ['Moong Dal', 'Toor Dal', 'Chana Dal', 'Urad Dal'], correctAnswer: 'Moong Dal' },
                { question: 'Pootharekulu is from?', clue: 'Paper sweet', options: ['Atreyapuram', 'Tirupati', 'Kakinada', 'Rajahmundry'], correctAnswer: 'Atreyapuram' },
                { question: 'Kakinada is famous for?', clue: 'Sweet snack', options: ['Kaja', 'Jalebi', 'Laddu', 'Mysore Pak'], correctAnswer: 'Kaja' },
                { question: 'Famous Andhra pickle?', clue: 'Spicy mango', options: ['Avakaya', 'Lemon Pickle', 'Chilli Pickle', 'Garlic Pickle'], correctAnswer: 'Avakaya' },
            ],
        };

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelector(`.tab:contains('${tab}')`).classList.add('active');
            document.getElementById(`panel-${tab}`).classList.add('active');
        }

        // Fix for :contains selector
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const text = this.textContent.trim();
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                if (text === 'Add Single') document.getElementById('panel-add').classList.add('active');
                if (text === 'Bulk Import') document.getElementById('panel-bulk').classList.add('active');
                if (text === 'Demo Data') document.getElementById('panel-demo').classList.add('active');
            });
        });

        async function apiPost(endpoint, body) {
            const res = await fetch(`${API_URL}${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                body: JSON.stringify(body),
            });
            return res.json();
        }

        async function apiGet(endpoint) {
            const res = await fetch(`${API_URL}${endpoint}`, {
                headers: { 'x-api-key': API_KEY },
            });
            return res.json();
        }

        async function loadStats() {
            try {
                const data = await apiGet('/api/games/questions?gameType=movie&limit=100');
                const movieCount = data.questions?.length || 0;
                const songData = await apiGet('/api/games/questions?gameType=song&limit=100');
                const songCount = songData.questions?.length || 0;
                const foodData = await apiGet('/api/games/questions?gameType=food&limit=100');
                const foodCount = foodData.questions?.length || 0;
                
                document.getElementById('stats').innerHTML = `
                    <div class="stat"><div class="stat-num">${movieCount}</div><div class="stat-label">Movies</div></div>
                    <div class="stat"><div class="stat-num">${songCount}</div><div class="stat-label">Songs</div></div>
                    <div class="stat"><div class="stat-num">${foodCount}</div><div class="stat-label">Food</div></div>
                    <div class="stat"><div class="stat-num">${movieCount + songCount + foodCount}</div><div class="stat-label">Total</div></div>
                `;
            } catch(e) { console.log('Stats load error:', e); }
        }

        function showMsg(panel, type, text) {
            document.getElementById(`msg-${panel}`).innerHTML = `<div class="msg ${type}">${text}</div>`;
        }

        async function submitSingle() {
            const gameType = document.getElementById('gameType').value;
            const question = document.getElementById('question').value;
            const clue = document.getElementById('clue').value;
            const options = ['opt1','opt2','opt3','opt4'].map(id => document.getElementById(id).value).filter(o => o.trim());
            const correctAnswer = document.getElementById('correct').value;

            if (!question || options.length < 2 || !correctAnswer) {
                return showMsg('add', 'error', 'Fill question, 2+ options, and correct answer');
            }

            try {
                const data = await apiPost('/api/games/add-question', { gameType, question, clue, options, correctAnswer });
                if (data.success) {
                    showMsg('add', 'success', 'Question added!');
                    document.querySelectorAll('#panel-add input').forEach(i => i.value = '');
                    loadStats();
                } else {
                    showMsg('add', 'error', data.error || 'Failed');
                }
            } catch(err) {
                showMsg('add', 'error', err.message);
            }
        }

        async function submitBulk() {
            const gameType = document.getElementById('bulkGameType').value;
            let questions;
            try {
                questions = JSON.parse(document.getElementById('bulkJson').value);
            } catch(e) {
                return showMsg('bulk', 'error', 'Invalid JSON format');
            }

            if (!Array.isArray(questions) || questions.length === 0) {
                return showMsg('bulk', 'error', 'Must be a non-empty array');
            }

            let added = 0, failed = 0;
            for (const q of questions) {
                try {
                    await apiPost('/api/games/add-question', { ...q, gameType });
                    added++;
                } catch(e) { failed++; }
            }
            showMsg('bulk', 'success', `Imported: ${added} success, ${failed} failed`);
            loadStats();
        }

        function generateDemo() {
            const type = document.getElementById('demoGameType').value;
            let data = {};
            if (type === 'all') {
                data = DEMO_DATA;
            } else {
                data = { [type]: DEMO_DATA[type] };
            }
            document.getElementById('demoPreview').textContent = JSON.stringify(data, null, 2);
            window._demoData = data;
        }

        async function importDemo() {
            if (!window._demoData) {
                return showMsg('demo', 'error', 'Click "Preview Demo Data" first');
            }
            
            let added = 0, failed = 0;
            for (const [gameType, questions] of Object.entries(window._demoData)) {
                for (const q of questions) {
                    try {
                        await apiPost('/api/games/add-question', { ...q, gameType });
                        added++;
                    } catch(e) { failed++; }
                }
            }
            showMsg('demo', 'success', `Imported: ${added} success, ${failed} failed`);
            loadStats();
        }

        loadStats();
    </script>
</body>
</html>
